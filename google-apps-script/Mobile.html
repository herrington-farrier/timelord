<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timelord</title>
    <style>
      :root { --bg:#0b1220; --card:#151d2e; --text:#f4f7fb; --muted:#9aa7b8; --edge:rgba(255,255,255,.08); }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
      header { padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: center; }
      h1 { margin: 0; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
      button { font: inherit; border-radius: 8px; border: 1px solid var(--edge); background: #1f2a3d; color: var(--text); padding: 6px 10px; }
      .item { margin: 0 12px 8px; padding: 10px 12px; border-radius: 10px; background: var(--card); border-left: 4px solid #94a3b8; }
      .item.done { opacity: .45; }
      .item.skipped { opacity: .45; text-decoration: line-through; }
      .buf { margin: 0 20px 6px; font-size: 12px; color: var(--muted); }
      .title { font-weight: 650; }
      .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .acts { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      .fall { margin: 16px 12px; padding: 10px; border: 1px dashed var(--edge); border-radius: 10px; }
      .err { color: #f87171; padding: 0 16px; }
      select { font: inherit; background: #1f2a3d; color: var(--text); border: 1px solid var(--edge); border-radius: 6px; padding: 4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Timelord</h1>
      <button id="rebuild">Rebuild</button>
    </header>
    <div class="err" id="err"></div>
    <div id="list"></div>
    <div class="fall" id="fall"></div>
    <script>
      function fail(e) { document.getElementById('err').textContent = e && e.message ? e.message : String(e); }
      function esc(s) { return String(s||'').replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]); }); }
      function fmtDur(hours) {
        var mins = Math.round(Number(hours) * 60);
        if (isNaN(mins) || mins <= 0) return '0m';
        var h = Math.floor(mins / 60);
        var m = mins % 60;
        if (h && m) return h + 'h ' + m + 'm';
        if (h) return h + 'h';
        return m + 'm';
      }
      function render(payload) {
        document.getElementById('err').textContent = '';
        var p = payload.payload || payload;
        var html = '';
        (p.plan || []).forEach(function (r) {
          if (r.bucket === 'Buffer' || r.source === 'buffer') {
            html += '<div class="buf">' + esc(r.title) + '</div>';
            return;
          }
          var cls = r.status === 'complete' ? ' done' : r.status === 'skipped' ? ' skipped' : '';
          html += '<div class="item' + cls + '" style="border-left-color:#' + esc(r.color) + '"><div class="title">' + esc(r.title) +
            '</div><div class="meta">' + esc(r.bucket) + ' · ' + esc(fmtDur(r.hours)) + '</div>';
          if (r.status === 'pending') {
            html += '<div class="acts"><button data-act="complete" data-id="' + esc(r.id) + '">Complete</button>' +
              '<button data-act="skip" data-id="' + esc(r.id) + '">Skip</button></div>';
          }
          html += '</div>';
        });
        document.getElementById('list').innerHTML = html;
        var fall = (p.summary || []).filter(function (s) { return s.kind === 'overflow' && s.date === p.date; });
        document.getElementById('fall').innerHTML = fall.length
          ? '<strong>Falling off</strong><br>' + fall.map(function (s) { return esc(s.bucket) + ': ' + esc(s.title) + ' · ' + esc(fmtDur(s.hours)); }).join('<br>')
          : '';
        Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (btn) {
          btn.onclick = function () {
            google.script.run.withSuccessHandler(load).withFailureHandler(fail).handleAction_({
              action: btn.getAttribute('data-act'),
              id: btn.getAttribute('data-id')
            });
          };
        });
      }
      function load() {
        google.script.run.withSuccessHandler(render).withFailureHandler(fail).getTodayPayload_('');
      }
      document.getElementById('rebuild').onclick = function () {
        google.script.run.withSuccessHandler(render).withFailureHandler(fail).rebuildToday();
      };
      load();
    </script>
  </body>
</html>
