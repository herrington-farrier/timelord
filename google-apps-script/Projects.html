<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 14px; font-size: 14px; color: #1e293b; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; align-items: end; }
      label { font-size: 12px; color: #475569; display: block; margin-bottom: 3px; }
      input, button { font: inherit; }
      input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #94a3b8; background: #f8fafc; cursor: pointer; }
      .primary { background: #1e293b; color: #fff; border-color: #1e293b; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="row">
      <div><label>Name</label><input id="name" type="text" /></div>
      <div><label>Hours</label><input id="hours" type="number" step="0.25" style="width:72px" value="1.5" /></div>
      <div><label>Active</label><input id="active" type="checkbox" checked /></div>
      <button class="primary" id="add">Add</button>
    </div>
    <div class="err" id="err"></div>
    <table><thead><tr><th>Name</th><th>Hours</th><th>Active</th><th></th></tr></thead><tbody id="body"></tbody></table>
    <script>
      function fail(e) { document.getElementById('err').textContent = e && e.message ? e.message : String(e); }
      function esc(s) { return String(s||'').replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]); }); }
      function render(list) {
        document.getElementById('err').textContent = '';
        var html = '';
        (list || []).forEach(function (t) {
          html += '<tr><td>' + esc(t.name) + '</td><td>' + t.hours + '</td><td>' + (t.active ? 'yes' : '') +
            '</td><td><button onclick="del(' + t.row + ')">Delete</button></td></tr>';
        });
        document.getElementById('body').innerHTML = html;
      }
      function del(row) { google.script.run.withSuccessHandler(render).withFailureHandler(fail).deleteProject(row); }
      document.getElementById('add').onclick = function () {
        google.script.run.withSuccessHandler(function (list) {
          document.getElementById('name').value = '';
          render(list);
        }).withFailureHandler(fail).addProject(
          document.getElementById('name').value,
          document.getElementById('hours').value,
          document.getElementById('active').checked
        );
      };
      google.script.run.withSuccessHandler(render).withFailureHandler(fail).listProjects();
    </script>
  </body>
</html>
