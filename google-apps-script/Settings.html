<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 14px; font-size: 14px; color: #1e293b; }
      h2 { margin: 0 0 10px; font-size: 16px; }
      label { font-size: 12px; color: #475569; display: block; margin-bottom: 3px; }
      input, button { font: inherit; }
      button { padding: 4px 8px; border-radius: 6px; border: 1px solid #94a3b8; background: #f8fafc; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e2e8f0; font-size: 13px; vertical-align: middle; }
      .muted { color: #64748b; font-size: 12px; margin: 0 0 12px; }
      .err { color: #b91c1c; min-height: 1.2em; }
      .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
      .card { background: #f1f5f9; border-radius: 8px; padding: 8px 10px; }
      .card b { display: block; font-size: 18px; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
      .hrs { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sub { display: block; font-size: 11px; color: #64748b; }
      input.daily { width: 64px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
    </style>
  </head>
  <body>
    <p class="muted">Daily × days/week = weekly. Change daily (or +/− 0.25h) and weekly updates; extra hours come from Unallocated, then lower-priority buckets down to their minimum. Rebuild today after you change hours.</p>
    <div id="totals" class="totals"></div>
    <div id="err" class="err"></div>
    <table>
      <thead>
        <tr>
          <th>Bucket</th>
          <th>Daily</th>
          <th>Weekly</th>
          <th>Min</th>
          <th>Marked</th>
          <th>Remaining</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <script>
      var DAYS = 7;
      function showErr(e) { document.getElementById('err').textContent = e && e.message ? e.message : String(e); }
      function fmt(n) {
        var x = Number(n);
        if (isNaN(x)) return '0';
        return Math.abs(x - Math.round(x)) < 1e-6 ? String(Math.round(x)) : x.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
      }
      function render(view) {
        DAYS = view.daysPerWeek || 7;
        document.getElementById('err').textContent = view.capped
          ? 'Capped at ' + fmt(view.applied) + 'h/week (not enough stealable hours below minima).'
          : '';
        document.getElementById('totals').innerHTML =
          card('Gross', fmt(view.gross) + ' /wk', fmt(view.gross / DAYS) + ' /day') +
          card('Personal', fmt(view.personal) + ' /wk', fmt(view.personal / DAYS) + ' /day') +
          card('Assignable', fmt(view.assignable) + ' /wk', fmt(view.assignable / DAYS) + ' /day') +
          card('Allocated', fmt(view.allocated) + ' /wk', fmt(view.allocated / DAYS) + ' /day') +
          card('Unallocated', fmt(view.unallocated) + ' /wk', fmt(view.unallocated / DAYS) + ' /day') +
          card('Buffer', view.bufferMinutes + 'm', 'between tasks');
        var html = '';
        (view.buckets || []).forEach(function (b) {
          html += '<tr><td><span class="swatch" style="background:#' + b.color + '"></span>' + escapeHtml(b.name) +
            '</td><td class="hrs"><button type="button" data-name="' + escapeHtml(b.name) + '" data-d="-0.25">−</button> ' +
            '<input class="daily" data-name="' + escapeHtml(b.name) + '" value="' + fmt(b.daily) + '" /> ' +
            '<button type="button" data-name="' + escapeHtml(b.name) + '" data-d="0.25">+</button></td>' +
            '<td class="hrs">' + fmt(b.weekly) + '<span class="sub">' + fmt(b.daily) + ' × ' + DAYS + '</span></td>' +
            '<td class="hrs">' + fmt(b.min) + '<span class="sub">' + fmt(b.minDaily) + ' /day</span></td>' +
            '<td class="hrs">' + fmt(b.marked) + '</td>' +
            '<td class="hrs">' + fmt(b.remaining) + '<span class="sub">' + fmt(b.remainingDaily) + ' /day</span></td></tr>';
        });
        document.getElementById('body').innerHTML = html;
        Array.prototype.forEach.call(document.querySelectorAll('button[data-d]'), function (btn) {
          btn.onclick = function () {
            google.script.run.withSuccessHandler(render).withFailureHandler(showErr)
              .bumpDailyHours(btn.getAttribute('data-name'), Number(btn.getAttribute('data-d')));
          };
        });
        Array.prototype.forEach.call(document.querySelectorAll('input.daily'), function (inp) {
          inp.onchange = function () {
            google.script.run.withSuccessHandler(render).withFailureHandler(showErr)
              .setDailyHours(inp.getAttribute('data-name'), inp.value);
          };
        });
      }
      function card(k, v, sub) {
        return '<div class="card">' + k + '<b>' + v + '</b>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>';
      }
      function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]); }); }
      google.script.run.withSuccessHandler(render).withFailureHandler(showErr).getSettingsView();
    </script>
  </body>
</html>
