<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 14px; font-size: 14px; color: #1e293b; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; align-items: end; }
      label { font-size: 12px; color: #475569; display: block; margin-bottom: 3px; }
      input, select, button { font: inherit; }
      input, select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #94a3b8; background: #f8fafc; cursor: pointer; }
      .primary { background: #1e293b; color: #fff; border-color: #1e293b; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
      .err { color: #b91c1c; }
      .muted { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <p class="muted">Locked personal time. Raising Work cannot steal these hours.</p>
    <div class="row">
      <div><label>Title</label><input id="title" type="text" style="width:220px" /></div>
      <div><label>Hours</label><input id="hours" type="number" step="0.25" style="width:72px" /></div>
      <div><label>Slot</label><select id="slot"><option>morning</option><option>midday</option><option>evening</option></select></div>
      <div><label>Days</label><input id="days" type="text" value="daily" style="width:120px" /></div>
      <button class="primary" id="add">Add</button>
    </div>
    <div class="err" id="err"></div>
    <table><thead><tr><th>Title</th><th>Hours</th><th>Slot</th><th>Days</th><th></th></tr></thead><tbody id="body"></tbody></table>
    <script>
      function fail(e) { document.getElementById('err').textContent = e && e.message ? e.message : String(e); }
      function esc(s) { return String(s||'').replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]); }); }
      function render(list) {
        document.getElementById('err').textContent = '';
        var html = '';
        (list || []).forEach(function (t) {
          html += '<tr><td>' + esc(t.title) + '</td><td>' + t.hours + '</td><td>' + esc(t.slot) + '</td><td>' + esc(t.cadence) +
            '</td><td><button onclick="del(' + t.row + ')">Delete</button></td></tr>';
        });
        document.getElementById('body').innerHTML = html;
      }
      function del(row) { google.script.run.withSuccessHandler(render).withFailureHandler(fail).deletePersonal(row); }
      document.getElementById('add').onclick = function () {
        google.script.run.withSuccessHandler(function (list) {
          document.getElementById('title').value = '';
          render(list);
        }).withFailureHandler(fail).addPersonal(
          document.getElementById('title').value,
          document.getElementById('hours').value,
          document.getElementById('slot').value,
          document.getElementById('days').value,
          true
        );
      };
      google.script.run.withSuccessHandler(render).withFailureHandler(fail).listPersonal();
    </script>
  </body>
</html>
