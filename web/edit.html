<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timelord · Edit</title>
  <link rel="stylesheet" href="styles.css?v=CACHEBUST" />
</head>
<body class="edit-page">
  <div class="wrap">
    <div class="title-row">
      <div class="title-left">
        <a href="index.html?v=CACHEBUST" class="chrome-btn">Today</a>
        <a href="calendar.html?v=CACHEBUST" class="chrome-btn">3-week</a>
        <button type="button" id="btn-rebuild" class="chrome-btn">Rebuild</button>
      </div>
      <h1 class="title-heading">Edit</h1>
      <div class="title-right">
        <span id="edit-stamp" class="stamp"></span>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <p class="hint">Change this tab, then <strong>Save this page</strong>. Rebuild after cadence or hours changes so Today reshuffles.</p>
    <div id="err" class="err"></div>
    <div id="ok" class="ok hidden"></div>
    <div id="panel"></div>
    <div class="page-save">
      <button type="button" id="btn-save-page" class="primary">Save this page</button>
    </div>
  </div>
  <datalist id="cadence-list">
    <option value="daily">Every day</option>
    <option value="weekdays">Weekdays</option>
    <option value="weekends">Weekends</option>
    <option value="eod">Every other day</option>
    <option value="weekly:Mon">Mondays</option>
    <option value="weekly:Sat">Saturdays</option>
    <option value="weekly:Sun">Sundays</option>
    <option value="weekly:Tue,Fri">Tue &amp; Fri</option>
    <option value="weekly:Wed,Sat">Wed &amp; Sat</option>
    <option value="every_3_4_days">Tue &amp; Fri</option>
    <option value="every_2_months">1st of even months</option>
  </datalist>
  <script src="config.js?v=CACHEBUST"></script>
  <script src="edit.js?v=CACHEBUST"></script>
</body>
</html>
